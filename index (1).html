<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Aksesoris Pria Sejati</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f3f 0%, #003d7a 100%);
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, #001f3f 0%, #003d7a 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #003d7a 0%, #001f3f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #001f3f;
            margin-bottom: 0.5rem;
        }

        .product-desc {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .product-price {
            font-size: 1.5rem;
            color: #001f3f;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .add-to-cart {
            width: 100%;
            padding: 0.8rem;
            background: #001f3f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .add-to-cart:hover {
            background: #003d7a;
        }

        .cart-section {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 2rem;
        }

        .cart-title {
            font-size: 2rem;
            color: #001f3f;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .cart-items {
            margin-bottom: 2rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            color: #001f3f;
            margin-bottom: 0.3rem;
        }

        .cart-item-price {
            color: #666;
        }

        .remove-item {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-item:hover {
            background: #c82333;
        }

        .cart-total {
            text-align: right;
            font-size: 1.5rem;
            font-weight: bold;
            color: #001f3f;
            margin: 1.5rem 0;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .checkout-form {
            display: grid;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            color: #001f3f;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #001f3f;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .payment-option {
            position: relative;
        }

        .payment-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .payment-label {
            display: block;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .payment-option input[type="radio"]:checked + .payment-label {
            border-color: #001f3f;
            background: #001f3f;
            color: white;
        }

        .checkout-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(90deg, #001f3f 0%, #003d7a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.3s ease;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .empty-cart {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>😎 Fadli Store 😎</h1>
        <p>Koleksi Aksesoris Berkualitas untuk Pria Sejati</p>
    </div>

    <div class="container">
        <div class="products" id="productsContainer"></div>

        <div class="cart-section">
            <h2 class="cart-title">🛒 Keranjang Belanja</h2>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total" id="cartTotal">Total: Rp 0</div>

            <form id="checkoutForm" class="checkout-form">
                <div class="form-group">
                    <label for="nama">Nama Lengkap *</label>
                    <input type="text" id="nama" name="nama" required>
                </div>

                <div class="form-group">
                    <label for="telepon">Nomor Telepon *</label>
                    <input type="tel" id="telepon" name="telepon" pattern="[0-9]+" required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat Lengkap *</label>
                    <textarea id="alamat" name="alamat" required></textarea>
                </div>

                <div class="form-group">
                    <label>Metode Pembayaran *</label>
                    <div class="payment-methods">
                        <div class="payment-option">
                            <input type="radio" id="bank" name="payment" value="Transfer Bank" required>
                            <label for="bank" class="payment-label">🏦 Transfer Bank</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="dana" name="payment" value="DANA">
                            <label for="dana" class="payment-label">💳 DANA</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="gopay" name="payment" value="GoPay">
                            <label for="gopay" class="payment-label">💰 GoPay</label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="checkout-btn" id="checkoutBtn">
                    Kirim Pesanan via WhatsApp
                </button>
            </form>
        </div>
    </div>

    <script>
        const products = [
            {
                id: 1,
                name: 'Jam Tangan Premium',
                desc: 'Jam tangan stainless steel dengan desain elegan',
                price: 1500000,
                icon: '⌚'
            },
            {
                id: 2,
                name: 'Cincin Perak',
                desc: 'Cincin perak murni 925 dengan finishing mewah',
                price: 300000,
                icon: '💍'
            },
            {
                id: 3,
                name: 'Kalung Emas',
                desc: 'Kalung emas 18K dengan desain maskulin',
                price: 200000,
                icon: '📿'
            },
            {
                id: 4,
                name: 'Kacamata Hitam',
                desc: 'Kacamata UV protection dengan frame premium',
                price: 150000,
                icon: '🕶️'
            },
            {
                id: 5,
                name: 'Topi Fedora',
                desc: 'Topi fedora klasik dari bahan berkualitas tinggi',
                price: 200000,
                icon: '🎩'
            }
        ];

        let cart = [];

        function formatRupiah(amount) {
            return 'Rp ' + amount.toLocaleString('id-ID');
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.icon}</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-desc">${product.desc}</div>
                        <div class="product-price">${formatRupiah(product.price)}</div>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">
                            Tambah ke Keranjang
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            renderCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            renderCart();
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartTotalContainer = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<div class="empty-cart">Keranjang masih kosong</div>';
                cartTotalContainer.textContent = 'Total: Rp 0';
                checkoutBtn.disabled = true;
                return;
            }

            checkoutBtn.disabled = false;

            cartItemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.icon} ${item.name} (x${item.quantity})</div>
                        <div class="cart-item-price">${formatRupiah(item.price * item.quantity)}</div>
                    </div>
                    <button class="remove-item" onclick="removeFromCart(${item.id})">Hapus</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cartTotalContainer.textContent = `Total: ${formatRupiah(total)}`;
        }

        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (cart.length === 0) {
                alert('Keranjang belanja masih kosong!');
                return;
            }

            const nama = document.getElementById('nama').value;
            const telepon = document.getElementById('telepon').value;
            const alamat = document.getElementById('alamat').value;
            const payment = document.querySelector('input[name="payment"]:checked').value;

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            let message = `*PESANAN BARU*\n\n`;
            message += `*Nama:* ${nama}\n`;
            message += `*Telepon:* ${telepon}\n`;
            message += `*Alamat:* ${alamat}\n\n`;
            message += `*DETAIL PESANAN:*\n`;
            
            cart.forEach(item => {
                message += `\n${item.icon} ${item.name}\n`;
                message += `Jumlah: ${item.quantity}\n`;
                message += `Harga: ${formatRupiah(item.price * item.quantity)}\n`;
            });

            message += `\n*TOTAL: ${formatRupiah(total)}*\n\n`;
            message += `*Metode Pembayaran:* ${payment}`;

            const whatsappNumber = '6289533769087';
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        });

        renderProducts();
        renderCart();
    </script>
</body>
</html>
